name: Build example - EFR32 factory image

on:
  push:
    branches:
      - silabs-mss-factory
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: true

env:
  CHIP_NO_LOG_TIMESTAMPS: true
  SILABS_BOARD: "BRD2703A"
  APP_NAME: "matter-silabs-lighting"
  FACTORY_SOFTWARE_VERSION: "1"
  FACTORY_SOFTWARE_VERSION_STRING: "1.0.0"
  INTERNAL_STORAGE_SLOT_START: "0x080EC000"
  COMMANDER_DOWNLOAD_URL: "https://www.silabs.com/documents/public/software/SimplicityCommander-Linux.zip"
  BOOTLOADER_DOWNLOAD_URL: "https://github.com/SiliconLabs/matter_extension/releases/download/v2.5.0/bootloader_binaries_matter_extension_v2.5.0-1.4.zip"
  BOOTLOADER_FILE_NAME: "bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37"
  snbAccessKey: ${{ secrets.IOT_ACCESS_KEY }}
  snbSecretKey: ${{ secrets.IOT_SECRET_KEY }}
  snbSignDataKey: ${{ secrets.IOT_SIGN_DATA_KEY_ID }}
  serviceAddress: ${{ secrets.IOT_SERVICE_ADDRESS }}
  PRODUCT_ID: ${{ secrets.PRODUCT_SILABS_01 }}
  MODULE_NAME: ${{ secrets.MODULE_NAME }}
  ENV: ${{ secrets.ENV }}
  appFirmwareType: "Application"
  bootloaderFirmwareType: "Bootloader"

jobs:
  efr32-factory:
    name: EFR32 BRD2703A factory v1
    runs-on: ubuntu-latest
    if: github.actor != 'restyled-io[bot]'

    container:
      image: ghcr.io/project-chip/chip-build-efr32:94

    steps:
      - name: Get tag or commit hash
        shell: bash
        run: |
          echo "Full ref: ${{ github.ref }}"
          echo "Ref name: ${{ github.ref_name }}"

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${{ github.ref_name }}"
            echo "Triggered by tag: $VERSION"
          else
            VERSION="${GITHUB_SHA}"
            echo "Triggered by branch, using commit hash: $VERSION"
          fi

          echo "Final version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules and bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        env:
          PW_CONFIG_FILE: scripts/setup/environment_efr32_ci.json
        with:
          platform: silabs_docker

      - name: Install ZAP from GitHub release
        shell: bash
        run: |
          source scripts/activate.sh
          ZAP_VERSION="$(< scripts/setup/zap.version)"
          ZAP_ROOT="$RUNNER_TEMP/matter-zap"
          python scripts/tools/zap/zap_download.py \
            --zap-version "$ZAP_VERSION" \
            --extract-root "$ZAP_ROOT"
          ZAP_INSTALL_PATH="$ZAP_ROOT/zap-$ZAP_VERSION"
          test -x "$ZAP_INSTALL_PATH/zap-cli"
          "$ZAP_INSTALL_PATH/zap-cli" --version
          echo "ZAP_INSTALL_PATH=$ZAP_INSTALL_PATH" >> "$GITHUB_ENV"

      - name: Install Simplicity Commander
        shell: bash
        run: |
          COMMANDER_ZIP="$RUNNER_TEMP/SimplicityCommander-Linux.zip"
          COMMANDER_PACKAGE_DIR="$RUNNER_TEMP/SimplicityCommander-Linux"
          COMMANDER_INSTALL_DIR="$RUNNER_TEMP/simplicity-commander"

          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates \
            bzip2 \
            curl \
            file \
            libqt5widgets5 \
            unzip
          rm -rf /var/lib/apt/lists/*

          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 600 \
            "$COMMANDER_DOWNLOAD_URL" \
            --output "$COMMANDER_ZIP"
          ls -lh "$COMMANDER_ZIP"
          file "$COMMANDER_ZIP"
          unzip -q "$COMMANDER_ZIP" -d "$COMMANDER_PACKAGE_DIR"

          mkdir -p "$COMMANDER_INSTALL_DIR"
          COMMANDER_ARCHIVE="$(find "$COMMANDER_PACKAGE_DIR" -type f -iname 'Commander-cli_linux_x86_64*.tar.bz' -print -quit)"
          if [ -z "$COMMANDER_ARCHIVE" ]; then
            COMMANDER_ARCHIVE="$(find "$COMMANDER_PACKAGE_DIR" -type f \( -iname '*.tar' -o -iname '*.tar.gz' -o -iname '*.tgz' -o -iname '*.tar.xz' -o -iname '*.tar.bz' -o -iname '*.tar.bz2' \) -print -quit)"
          fi
          if [ -n "$COMMANDER_ARCHIVE" ]; then
            echo "Using Commander archive: $COMMANDER_ARCHIVE"
            tar -xf "$COMMANDER_ARCHIVE" -C "$COMMANDER_INSTALL_DIR"
          fi

          COMMANDER_BIN="$(find "$COMMANDER_INSTALL_DIR" "$COMMANDER_PACKAGE_DIR" -type f \( -name commander -o -name commander.sh -o -name commander-cli \) -print -quit)"
          if [ -z "$COMMANDER_BIN" ]; then
            echo "::error::Unable to find commander binary in downloaded Simplicity Commander package"
            find "$COMMANDER_PACKAGE_DIR" -maxdepth 4 -type f | sort
            exit 1
          fi
          chmod +x "$COMMANDER_BIN"
          ln -sf "$COMMANDER_BIN" "$COMMANDER_INSTALL_DIR/commander"
          echo "$COMMANDER_INSTALL_DIR" >> "$GITHUB_PATH"
          echo "COMMANDER_PATH=$COMMANDER_INSTALL_DIR/commander" >> "$GITHUB_ENV"
          "$COMMANDER_INSTALL_DIR/commander" --version

      - name: Set up snb-command
        shell: bash
        run: |
          curl --fail --location --show-error --retry 5 --retry-all-errors \
            https://github.com/yue-leaf/cli-test/releases/download/v1.0.4/snb \
            --output snb
          chmod +x snb
          ln -sf "$(pwd)/snb" /usr/local/bin/snb
          snb config --serviceAddress "$serviceAddress" --accessKey "$snbAccessKey" --secretKey "$snbSecretKey"

      - name: Download BRD2703A internal-storage bootloader
        shell: bash
        run: |
          BOOTLOADER_ZIP="$RUNNER_TEMP/bootloader_binaries_matter_extension_v2.5.0-1.4.zip"
          BOOTLOADER_PACKAGE_DIR="$RUNNER_TEMP/bootloader-binaries"
          OUTPUT_DIR="out/efr32-factory-artifacts"

          curl --fail --location --show-error --retry 5 --retry-all-errors \
            --connect-timeout 30 --max-time 300 \
            "$BOOTLOADER_DOWNLOAD_URL" \
            --output "$BOOTLOADER_ZIP"
          unzip -q "$BOOTLOADER_ZIP" -d "$BOOTLOADER_PACKAGE_DIR"

          BOOTLOADER_SOURCE="$(find "$BOOTLOADER_PACKAGE_DIR" -type f -name "$BOOTLOADER_FILE_NAME" -print -quit)"
          test -n "$BOOTLOADER_SOURCE"
          mkdir -p "$OUTPUT_DIR"
          cp "$BOOTLOADER_SOURCE" "$OUTPUT_DIR/$BOOTLOADER_FILE_NAME"
          commander util appinfo "$OUTPUT_DIR/$BOOTLOADER_FILE_NAME"

      - name: Signature bootloader
        shell: bash
        run: |
          OUTPUT_DIR="out/efr32-factory-artifacts"
          RAW_BOOTLOADER_S37="$OUTPUT_DIR/$BOOTLOADER_FILE_NAME"
          BOOTLOADER_PREFIX="$OUTPUT_DIR/${BOOTLOADER_FILE_NAME%.s37}"
          SIGNATURE_FILE="$OUTPUT_DIR/${BOOTLOADER_FILE_NAME%.s37}.der"
          PUBLIC_KEY_FILE="$OUTPUT_DIR/bootloader_public_key.pem"
          SIGNED_BOOTLOADER_S37="$OUTPUT_DIR/signatured_$BOOTLOADER_FILE_NAME"

          test -f "$RAW_BOOTLOADER_S37"
          commander convert "$RAW_BOOTLOADER_S37" --secureboot --extsign --outfile "$BOOTLOADER_PREFIX"
          snb kms sign --keyId "$snbSignDataKey" --algorithm ecdsa_sha_256 --inputFile "${BOOTLOADER_PREFIX}.extsign" --outputFile "$SIGNATURE_FILE"
          snb kms exportPubKey --keyId "$snbSignDataKey" --outputFile "$PUBLIC_KEY_FILE"
          commander convert "$RAW_BOOTLOADER_S37" --secureboot --signature "$SIGNATURE_FILE" --verify "$PUBLIC_KEY_FILE" --outfile "$SIGNED_BOOTLOADER_S37"
          commander util appinfo "$SIGNED_BOOTLOADER_S37"

      - name: Build internal-storage-safe factory app
        shell: bash
        run: |
          scripts/examples/gn_silabs_example.sh \
            examples/lighting-app/silabs \
            out/efr32-factory \
            "$SILABS_BOARD" \
            --docker \
            --slc_generate \
            --additional_data_advertising \
            chip_detail_logging=false \
            chip_automation_logging=false \
            chip_progress_logging=false \
            is_debug=false \
            disable_lcd=true \
            show_qr_code=false \
            chip_build_libshell=false \
            chip_logging=false \
            silabs_log_enabled=false \
            enable_openthread_cli=false \
            chip_openthread_ftd=true \
            chip_enable_ota_requestor=true \
            use_external_flash=false \
            use_rps_extension=false \
            "sl_matter_version=${FACTORY_SOFTWARE_VERSION}" \
            "sl_matter_version_str=\"${FACTORY_SOFTWARE_VERSION_STRING}\""

          BUILD_DIR="out/efr32-factory/$SILABS_BOARD"
          test -f "$BUILD_DIR/matter-silabs-lighting-example.s37"
          grep -E "sl_matter_version_str *= *\"${FACTORY_SOFTWARE_VERSION_STRING}\"" "$BUILD_DIR/args.gn"

      - name: Validate and stage factory artifacts
        shell: bash
        run: |
          source scripts/activate.sh

          BUILD_DIR="out/efr32-factory/$SILABS_BOARD"
          OUTPUT_DIR="out/efr32-factory-artifacts"
          APP_S37="$BUILD_DIR/matter-silabs-lighting-example.s37"
          UNSIGNED_FACTORY_S37="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-unsigned.s37"
          FACTORY_S37="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-signed.s37"
          EXTSIGN_PREFIX="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}"
          SIGNATURE_FILE="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-signature.der"
          PUBLIC_KEY_FILE="$OUTPUT_DIR/application_public_key.pem"
          APP_INFO="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-appinfo.txt"

          mkdir -p "$OUTPUT_DIR"
          cp "$APP_S37" "$UNSIGNED_FACTORY_S37"
          commander convert "$APP_S37" --secureboot --extsign --outfile "$EXTSIGN_PREFIX"
          snb kms sign --keyId "$snbSignDataKey" --algorithm ecdsa_sha_256 --inputFile "${EXTSIGN_PREFIX}.extsign" --outputFile "$SIGNATURE_FILE"
          snb kms exportPubKey --keyId "$snbSignDataKey" --outputFile "$PUBLIC_KEY_FILE"
          commander convert "$APP_S37" --secureboot --signature "$SIGNATURE_FILE" --verify "$PUBLIC_KEY_FILE" --outfile "$FACTORY_S37"

          commander util appinfo "$FACTORY_S37" | tee "$APP_INFO"
          EXPECTED_APP_VERSION_HEX="$(printf '0x%08x' "$FACTORY_SOFTWARE_VERSION")"
          grep -E "App version[[:space:]]*:[[:space:]]*${EXPECTED_APP_VERSION_HEX}" "$APP_INFO"

          python3 - "$FACTORY_S37" "$INTERNAL_STORAGE_SLOT_START" <<'PY'
          import sys
          path = sys.argv[1]
          slot_start = int(sys.argv[2], 0)
          min_addr = None
          max_end = 0
          with open(path, "r", encoding="ascii", errors="strict") as f:
              for raw in f:
                  line = raw.strip()
                  if not line.startswith("S") or len(line) < 4:
                      continue
                  kind = line[1]
                  if kind not in ("1", "2", "3"):
                      continue
                  count = int(line[2:4], 16)
                  addr_len = {"1": 2, "2": 3, "3": 4}[kind]
                  addr = int(line[4:4 + addr_len * 2], 16)
                  data_len = count - addr_len - 1
                  if data_len <= 0:
                      continue
                  end = addr + data_len
                  min_addr = addr if min_addr is None else min(min_addr, addr)
                  max_end = max(max_end, end)
          print(f"S37 data range: 0x{min_addr:08X}-0x{max_end:08X}; internal OTA slot starts at 0x{slot_start:08X}")
          if max_end > slot_start:
              raise SystemExit(f"Factory application overlaps internal OTA slot: max end 0x{max_end:08X} > slot start 0x{slot_start:08X}")
          PY

          ls -lh "$UNSIGNED_FACTORY_S37" "$FACTORY_S37" "$APP_INFO" "$OUTPUT_DIR/$BOOTLOADER_FILE_NAME" "$OUTPUT_DIR/signatured_$BOOTLOADER_FILE_NAME"

      - name: Push factory app and bootloader
        shell: bash
        run: |
          OUTPUT_DIR="out/efr32-factory-artifacts"
          UNSIGNED_APP_S37="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-unsigned.s37"
          SIGNED_APP_S37="$OUTPUT_DIR/${APP_NAME}-factory-v${FACTORY_SOFTWARE_VERSION}-signed.s37"
          UNSIGNED_BOOTLOADER_S37="$OUTPUT_DIR/$BOOTLOADER_FILE_NAME"
          SIGNED_BOOTLOADER_S37="$OUTPUT_DIR/signatured_$BOOTLOADER_FILE_NAME"

          test -f "$UNSIGNED_APP_S37"
          test -f "$SIGNED_APP_S37"
          test -f "$UNSIGNED_BOOTLOADER_S37"
          test -f "$SIGNED_BOOTLOADER_S37"

          snb obis push \
            --file "$UNSIGNED_APP_S37" \
            --fileType "$appFirmwareType" \
            --productId "$PRODUCT_ID" \
            --moduleName "$MODULE_NAME" \
            --env "$ENV" \
            --version "$VERSION"

          snb obis push \
            --file "$SIGNED_APP_S37" \
            --fileType "$appFirmwareType" \
            --productId "$PRODUCT_ID" \
            --moduleName "$MODULE_NAME" \
            --env "$ENV" \
            --version "$VERSION"

          snb obis push \
            --file "$UNSIGNED_BOOTLOADER_S37" \
            --fileType "$bootloaderFirmwareType" \
            --productId "$PRODUCT_ID" \
            --moduleName "$MODULE_NAME" \
            --env "$ENV" \
            --version "$VERSION"

          snb obis push \
            --file "$SIGNED_BOOTLOADER_S37" \
            --fileType "$bootloaderFirmwareType" \
            --productId "$PRODUCT_ID" \
            --moduleName "$MODULE_NAME" \
            --env "$ENV" \
            --version "$VERSION"

      - name: Publish EFR32 factory artifacts
        id: upload-factory-artifacts
        uses: actions/upload-artifact@v4
        with:
          name: efr32-brd2703a-light-factory-v${{ env.FACTORY_SOFTWARE_VERSION }}-${{ github.sha }}
          if-no-files-found: error
          path: |
            out/efr32-factory-artifacts/matter-silabs-lighting-factory-v*.s37
            out/efr32-factory-artifacts/matter-silabs-lighting-factory-v*-appinfo.txt
            out/efr32-factory-artifacts/bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37
            out/efr32-factory-artifacts/signatured_bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37

      - name: Show artifact URL
        shell: bash
        run: |
          echo "Factory artifact download URL: ${{ steps.upload-factory-artifacts.outputs.artifact-url }}"
