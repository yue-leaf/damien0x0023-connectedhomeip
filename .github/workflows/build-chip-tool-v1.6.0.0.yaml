name: Build chip-tool v1.6.0.0

on:
  push:
    branches:
      - chip-tool-v1.6.0.0
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

jobs:
  chip_tool:
    name: chip_tool (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    if: github.actor != 'restyled-io[bot]'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
            target_cpu: x64
          - arch: arm64
            runner: ubuntu-22.04-arm
            target_cpu: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux

      - name: Check code path and Install Dependencies
        run: |
          pwd
          sudo apt-get update
          sudo apt-get install -y git gcc g++ pkg-config libssl-dev libdbus-1-dev \
            libglib2.0-dev libavahi-client-dev ninja-build python3-venv python3-dev \
            python3-pip unzip libgirepository1.0-dev libcairo2-dev libreadline-dev \
            default-jre

      - name: Build chip-tool
        run: |
          BUILD_DIR="out/chiptool_${{ matrix.arch }}_release"
          OUTPUT_DIR="/tmp/chip-tool-artifact/${{ matrix.arch }}"
          mkdir -p "$OUTPUT_DIR"
          scripts/run_in_build_env.sh "gn gen $BUILD_DIR --args='target_cpu=\"${{ matrix.target_cpu }}\" chip_mdns=\"platform\" chip_crypto=\"mbedtls\" symbol_level=0 is_debug=false enable_im_pretty_print=true'"
          scripts/run_in_build_env.sh "ninja -C $BUILD_DIR chip-tool -v"
          if [ -f "$BUILD_DIR/chip-tool" ]; then
            echo "chip-tool found, proceeding to strip"
            ls -l "$BUILD_DIR/chip-tool"
            strip "$BUILD_DIR/chip-tool" -o "$OUTPUT_DIR/chip-tool"
          else
            echo "Error: chip-tool not found in $BUILD_DIR"
            ls -l "$BUILD_DIR"
            exit 1
          fi

      - name: Build chip-cert
        run: |
          BUILD_DIR="out/chipcert_${{ matrix.arch }}_release"
          OUTPUT_DIR="/tmp/chip-cert-artifact/${{ matrix.arch }}"
          mkdir -p "$OUTPUT_DIR"
          scripts/run_in_build_env.sh "gn gen $BUILD_DIR --args='target_cpu=\"${{ matrix.target_cpu }}\" symbol_level=0 is_debug=false chip_crypto=\"boringssl\"'"
          scripts/run_in_build_env.sh "ninja -C $BUILD_DIR chip-cert"
          test -f "$BUILD_DIR/chip-cert"
          strip "$BUILD_DIR/chip-cert" -o "$OUTPUT_DIR/chip-cert"

      - name: Verify build environment
        run: |
          test "$(getconf GNU_LIBC_VERSION)" = "glibc 2.35"

      - name: Upload chip-tool build
        uses: actions/upload-artifact@v4
        with:
          name: chip-tool-${{ matrix.arch }}-build
          path: /tmp/chip-tool-artifact
          retention-days: 1
          compression-level: 0

      - name: Upload chip-cert build
        uses: actions/upload-artifact@v4
        with:
          name: chip-cert-${{ matrix.arch }}-build
          path: /tmp/chip-cert-artifact
          retention-days: 1
          compression-level: 0

  package:
    name: Package build artifacts
    runs-on: ubuntu-22.04
    needs: chip_tool
    if: github.actor != 'restyled-io[bot]'

    steps:
      - name: Package chip-tool
        uses: actions/upload-artifact/merge@v4
        with:
          name: chip-tool
          pattern: chip-tool-*-build
          delete-merged: true
          compression-level: 0

      - name: Package chip-cert
        uses: actions/upload-artifact/merge@v4
        with:
          name: chip-cert
          pattern: chip-cert-*-build
          delete-merged: true
          compression-level: 0
