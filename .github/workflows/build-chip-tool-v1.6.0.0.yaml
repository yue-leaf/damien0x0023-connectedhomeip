name: Build chip-tool v1.6.0.0

on:
  push:
    branches:
      - chip-tool-v1.6.0.0
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

jobs:
  chip_tool:
    name: chip_tool
    runs-on: ubuntu-24.04
    if: github.actor != 'restyled-io[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: linux

      - name: Check code path and Install Dependencies
        run: |
          pwd
          sudo apt-get update
          sudo apt-get install -y git gcc g++ pkg-config libssl-dev libdbus-1-dev \
            libglib2.0-dev libavahi-client-dev ninja-build python3-venv python3-dev \
            python3-pip unzip libgirepository1.0-dev libcairo2-dev libreadline-dev \
            default-jre

      - name: Build chip-tool
        run: |
          mkdir -p /tmp/output_binaries
          chmod -R 777 /tmp/output_binaries
          scripts/run_in_build_env.sh "gn gen out/chiptool_x64_release --args='chip_mdns=\"platform\" chip_crypto=\"mbedtls\" symbol_level=0 is_debug=false enable_im_pretty_print=true'"
          scripts/run_in_build_env.sh "ninja -C out/chiptool_x64_release chip-tool -v"
          if [ -f out/chiptool_x64_release/chip-tool ]; then
            echo "chip-tool found, proceeding to strip"
            ls -l out/chiptool_x64_release/chip-tool
            strip out/chiptool_x64_release/chip-tool -o /tmp/output_binaries/chip-tool_x64
          else
            echo "Error: chip-tool not found in out/chiptool_x64_release/"
            ls -l out/chiptool_x64_release/
            exit 1
          fi

      - name: Build x64 chip-cert
        run: |
          scripts/run_in_build_env.sh "gn gen out/chipcert_x64_release --args='symbol_level=0 is_debug=false chip_crypto=\"boringssl\"'"
          scripts/run_in_build_env.sh "ninja -C out/chipcert_x64_release chip-cert"
          test -f out/chipcert_x64_release/chip-cert
          strip out/chipcert_x64_release/chip-cert -o /tmp/output_binaries/chip-cert_x64

      - name: Upload build chip-tool
        uses: actions/upload-artifact@v4
        with:
          name: chip-tool-v1.6.0.0
          path: /tmp/output_binaries/chip-tool_x64

      - name: Upload build chip-cert
        uses: actions/upload-artifact@v4
        with:
          name: chip-cert-v1.6.0.0
          path: /tmp/output_binaries/chip-cert_x64
