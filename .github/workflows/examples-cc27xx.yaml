name: Build example - TI CC27XX

on:
    workflow_dispatch:
    push:
        branches:
            - ti-cc2745-self

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true

jobs:
    cc27xx:
        name: cc27xx

        env:
            BUILD_TYPE: gn_cc27xx

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/project-chip/chip-build-ti:81
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install ZAP
              shell: bash
              run: |
                  ZAP_VERSION="$(cat scripts/setup/zap.version)"
                  case "$(uname -m)" in
                      x86_64) ZAP_FLAVOR=linux-x64 ;;
                      aarch64 | arm64) ZAP_FLAVOR=linux-arm64 ;;
                      *) echo "Unsupported ZAP platform: $(uname -sm)" && exit 1 ;;
                  esac

                  ZAP_ROOT="${RUNNER_TEMP:-/tmp}/zap"
                  ZAP_ARCHIVE="${RUNNER_TEMP:-/tmp}/zap.zip"
                  rm -rf "$ZAP_ROOT"
                  mkdir -p "$ZAP_ROOT"
                  wget -q -O "$ZAP_ARCHIVE" "https://github.com/project-chip/zap/releases/download/${ZAP_VERSION}/zap-${ZAP_FLAVOR}.zip"
                  python3 - "$ZAP_ARCHIVE" "$ZAP_ROOT" <<'PY'
                  import sys
                  import zipfile

                  archive, output = sys.argv[1:]
                  with zipfile.ZipFile(archive) as zap:
                      zap.extractall(output)
                  PY
                  chmod +x "$ZAP_ROOT/zap-cli"
                  echo "ZAP_INSTALL_PATH=$ZAP_ROOT" >> "$GITHUB_ENV"

                  python3 - <<'PY'
                  import json

                  path = "scripts/setup/environment.json"
                  with open(path, encoding="utf-8") as f:
                      config = json.load(f)

                  config["cipd_package_files"] = [
                      package for package in config["cipd_package_files"]
                      if package != "scripts/setup/zap.json"
                  ]

                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(config, f, indent=4)
                      f.write("\n")
                  PY

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                  platform: cc27xx
                  extra-submodule-parameters: " --recursive"

            - name: Install TI SysConfig
              shell: bash
              run: |
                  if [ ! -d /opt/ti/sysconfig_1.23.2 ]; then
                      wget https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/1.23.2.4156/sysconfig-1.23.2_4156-setup.run
                      chmod +x sysconfig-1.23.2_4156-setup.run
                      ./sysconfig-1.23.2_4156-setup.run --mode unattended
                  fi
                  echo "TI_SYSCONFIG_ROOT=/opt/ti/sysconfig_1.23.2" >> "$GITHUB_ENV"

            - name: Build examples
              run: |
                  scripts/run_in_build_env.sh '
                      set -euo pipefail

                      BUILD_DIR=out/ti-cc27xx-lighting-ftd
                      ARTIFACT_DIR=out/artifacts/ti-cc27xx-lighting-ftd
                      APP_NAME=chip-LP_EM_CC2745R10_Q1-lighting-example

                      gn gen "$BUILD_DIR" --root=examples/lighting-app/ti/cc27xx --args="
                          ti_sysconfig_root=\"${TI_SYSCONFIG_ROOT}\"
                          ti_simplelink_board=\"LP_EM_CC2745R10_Q1\"
                          chip_generate_link_map_file=true
                          chip_openthread_ftd=true
                          chip_progress_logging=true
                          custom_factory_data=true
                          ti_dac_key_use_psa_hsm=true
                          target_defines=[
                              \"TI_ATTESTATION_CREDENTIALS=1\",
                              \"TI_CC27XX_FREERTOS_HEAP_SIZE=43008\",
                          ]
                      "
                      ninja -C "$BUILD_DIR" \
                          "${APP_NAME}.out" \
                          "${APP_NAME}-without-factory-data.hex"

                      if ! arm-none-eabi-nm "$BUILD_DIR/${APP_NAME}.out" |
                          grep -E "^[0-9a-fA-F]+[[:space:]]+T[[:space:]]+tfm_hal_its_fs_info$" > /dev/null; then
                          echo "Expected strong tfm_hal_its_fs_info override" >&2
                          exit 1
                      fi

                      mkdir -p "$ARTIFACT_DIR"
                      cp "$BUILD_DIR/${APP_NAME}.out" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}.out.map" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}-without-factory-data.hex" "$ARTIFACT_DIR/"
                  '

            - name: Uploading build artifacts
              uses: actions/upload-artifact@v4
              if: ${{ !env.ACT }}
              with:
                  name: cc27xx-lighting
                  path: out/artifacts/ti-cc27xx-lighting-ftd/
