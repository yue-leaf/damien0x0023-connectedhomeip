name: Build example - TI CC27XX

on:
    workflow_dispatch:
    push:
        branches:
            - ti-cc2745-self

concurrency:
    group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
    cancel-in-progress: true

env:
    CHIP_NO_LOG_TIMESTAMPS: true

jobs:
    cc27xx:
        name: cc27xx

        env:
            BUILD_TYPE: gn_cc27xx

        runs-on: ubuntu-latest
        if: github.actor != 'restyled-io[bot]'

        container:
            image: ghcr.io/project-chip/chip-build-ti:81
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Install ZAP
              shell: bash
              run: |
                  ZAP_VERSION="$(cat scripts/setup/zap.version)"
                  case "$(uname -m)" in
                      x86_64) ZAP_FLAVOR=linux-x64 ;;
                      aarch64 | arm64) ZAP_FLAVOR=linux-arm64 ;;
                      *) echo "Unsupported ZAP platform: $(uname -sm)" && exit 1 ;;
                  esac

                  ZAP_ROOT="${RUNNER_TEMP:-/tmp}/zap"
                  ZAP_ARCHIVE="${RUNNER_TEMP:-/tmp}/zap.zip"
                  rm -rf "$ZAP_ROOT"
                  mkdir -p "$ZAP_ROOT"
                  wget -q -O "$ZAP_ARCHIVE" "https://github.com/project-chip/zap/releases/download/${ZAP_VERSION}/zap-${ZAP_FLAVOR}.zip"
                  python3 - "$ZAP_ARCHIVE" "$ZAP_ROOT" <<'PY'
                  import sys
                  import zipfile

                  archive, output = sys.argv[1:]
                  with zipfile.ZipFile(archive) as zap:
                      zap.extractall(output)
                  PY
                  chmod +x "$ZAP_ROOT/zap-cli"
                  echo "ZAP_INSTALL_PATH=$ZAP_ROOT" >> "$GITHUB_ENV"

                  python3 - <<'PY'
                  import json

                  path = "scripts/setup/environment.json"
                  with open(path, encoding="utf-8") as f:
                      config = json.load(f)

                  config["cipd_package_files"] = [
                      package for package in config["cipd_package_files"]
                      if package != "scripts/setup/zap.json"
                  ]

                  with open(path, "w", encoding="utf-8") as f:
                      json.dump(config, f, indent=4)
                      f.write("\n")
                  PY

            - name: Checkout submodules & Bootstrap
              uses: ./.github/actions/checkout-submodules-and-bootstrap
              with:
                  platform: cc27xx
                  extra-submodule-parameters: " --recursive"

            - name: Install TI SysConfig
              shell: bash
              run: |
                  if [ ! -d /opt/ti/sysconfig_1.26.3 ]; then
                      wget https://dr-download.ti.com/software-development/ide-configuration-compiler-or-debugger/MD-nsUM6f7Vvb/1.26.3.4558/sysconfig-1.26.3_4558-setup.run
                      chmod +x sysconfig-1.26.3_4558-setup.run
                      ./sysconfig-1.26.3_4558-setup.run --mode unattended
                  fi
                  echo "TI_SYSCONFIG_ROOT=/opt/ti/sysconfig_1.26.3" >> "$GITHUB_ENV"

            - name: Build examples
              run: |
                  scripts/run_in_build_env.sh '
                      set -euo pipefail

                      BUILD_DIR=out/ti-cc27xx-lighting-ftd
                      ARTIFACT_DIR=out/artifacts/ti-cc27xx-lighting-ftd
                      APP_NAME=chip-LP_EM_CC2745R10_Q1-lighting-example
                      TI_SDK_DIR=third_party/ti_simplelink_sdk/repo_cc23xx_cc27xx
                      EXPECTED_TI_SDK_COMMIT=68ca021502383f367d0bf2a5517fdd0dcb0ef909

                      ACTUAL_TI_SDK_COMMIT=$(git -C "$TI_SDK_DIR" rev-parse HEAD)
                      if [ "$ACTUAL_TI_SDK_COMMIT" != "$EXPECTED_TI_SDK_COMMIT" ]; then
                          echo "Unexpected TI SDK commit: $ACTUAL_TI_SDK_COMMIT" >&2
                          exit 1
                      fi

                      GCC_BIN=$(command -v arm-none-eabi-gcc)
                      GCC_ARMCOMPILER=$(dirname "$(dirname "$(readlink -f "$GCC_BIN")")")
                      CMAKE_BIN=$(command -v cmake)
                      export CMAKE_BUILD_PARALLEL_LEVEL=$(nproc)

                      make -C "$TI_SDK_DIR" build-gcc \
                          CMAKE="$CMAKE_BIN" \
                          GCC_ARMCOMPILER="$GCC_ARMCOMPILER" \
                          TICLANG_ARMCOMPILER= \
                          IAR_ARMCOMPILER=

                      REQUIRED_TI_LIBRARIES=(
                          source/ti/drivers/lib/gcc/m33f/drivers_cc27xxx10.a
                          source/ti/devices/cc27xxx10/driverlib/lib/gcc/driverlib.a
                          source/ti/drivers/secure/lib/gcc/m33f/secure_drivers_cc27xxx10.a
                          source/third_party/hsmddk/lib/gcc/m33f/hsmddk_cc27xxx10_its.a
                          source/ti/drivers/rcl/lib/gcc/m33f/rcl_cc27xxx10.a
                          source/ti/devices/cc27xxx10/rf_patches/lib/gcc/m33f/lrf_cc27xxx10.a
                          source/third_party/psa_crypto/lib/gcc/m33f/psa_crypto_cc27xx.a
                          source/ti/ble/lib/CC27XXX10/OneLib/lib/ticlang/m33f/OneLib.a
                          source/ti/ble/lib/CC27XXX10/StackWrapper/lib/ticlang/m33f/StackWrapper.a
                      )
                      for library in "${REQUIRED_TI_LIBRARIES[@]}"; do
                          if [ ! -s "$TI_SDK_DIR/$library" ]; then
                              echo "Required TI SDK library is missing: $library" >&2
                              exit 1
                          fi
                      done

                      gn gen "$BUILD_DIR" --root=examples/lighting-app/ti/cc27xx --args="
                          ti_sysconfig_root=\"${TI_SYSCONFIG_ROOT}\"
                          ti_simplelink_board=\"LP_EM_CC2745R10_Q1\"
                          chip_generate_link_map_file=true
                          chip_openthread_ftd=true
                          chip_progress_logging=true
                          custom_factory_data=true
                          ti_dac_key_use_psa_hsm=true
                          target_defines=[
                              \"TI_ATTESTATION_CREDENTIALS=1\",
                              \"TI_CC27XX_FREERTOS_HEAP_SIZE=43008\",
                          ]
                      "
                      ninja -C "$BUILD_DIR" \
                          "${APP_NAME}.out" \
                          "${APP_NAME}-without-factory-data.hex"

                      if ! arm-none-eabi-nm "$BUILD_DIR/${APP_NAME}.out" |
                          grep -E "^[0-9a-fA-F]+[[:space:]]+T[[:space:]]+tfm_hal_its_fs_info$" > /dev/null; then
                          echo "Expected strong tfm_hal_its_fs_info override" >&2
                          exit 1
                      fi

                      mkdir -p "$ARTIFACT_DIR"
                      cp "$BUILD_DIR/${APP_NAME}.out" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}.out.map" "$ARTIFACT_DIR/"
                      cp "$BUILD_DIR/${APP_NAME}-without-factory-data.hex" "$ARTIFACT_DIR/"
                  '

            - name: Uploading build artifacts
              uses: actions/upload-artifact@v4
              if: ${{ !env.ACT }}
              with:
                  name: cc27xx-lighting
                  path: out/artifacts/ti-cc27xx-lighting-ftd/
