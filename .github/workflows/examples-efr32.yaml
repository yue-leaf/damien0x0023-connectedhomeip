name: Build example - EFR32

on:
  push:
    branches:
      - silabs-ci
    tags:
      - 'v*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

env:
  CHIP_NO_LOG_TIMESTAMPS: true
  snbAccessKey: ${{ secrets.IOT_ACCESS_KEY }}
  snbSecretKey: ${{ secrets.IOT_SECRET_KEY }}
  snbSignDataKey: ${{ secrets.IOT_SIGN_DATA_KEY_ID }}
  serviceAddress: ${{ secrets.IOT_SERVICE_ADDRESS }}
  firmwareName: "matter-silabs-lighting"
  appFirmwareType: "Application"
  bootloaderFirmwareType: "Bootloader"
  appFirmwareResourcePackageId: ${{ secrets.APPFIRMWARERESOURCEPACKAGEID }}
  bootloaderResourcePackageId: ${{ secrets.BOOTLOADERRESOURCEPACKAGEID }}

jobs:
  efr32:
    name: EFR32

    env:
      SILABS_BOARD: BRD2703A
      BUILD_TYPE: gn_efr32

    runs-on: ubuntu-latest
    if: github.actor != 'restyled-io[bot]'

    container:
      image: ghcr.io/project-chip/chip-build-efr32:94
      volumes:
        - "/tmp/bloat_reports:/tmp/bloat_reports"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: silabs_docker

      - name: Set up environment for size reports
        uses: ./.github/actions/setup-size-reports
        if: ${{ !env.ACT }}
        with:
          gh-context: ${{ toJson(github) }}

#      - name: Test SLC gen
#        timeout-minutes: 30
#        run: |
#          scripts/examples/gn_silabs_example.sh examples/lighting-app/silabs ./out/light-app BRD2703A  --slc_generate --docker
#          echo "=========================1======================"
#          ls out/light-app/
#          echo "=========================2======================"
#
#      - name: Publish artifacts 1
#        uses: actions/upload-artifact@v4
#        with:
#          name: light-app,${{ github.event_name }}
#          path: |
#            out/light-app/*
#
#      - name: clean out build output
#        run: rm -rf ./out

      - name: Build light
        run: |
          ./scripts/run_in_build_env.sh \
             "./scripts/build/build_examples.py \
                --enable-flashbundle \
                --target efr32-brd2703a-light-skip-rps-generation \
                build \
                --copy-artifacts-to out/artifacts \
             "
          echo "========================1====================="
          ls out/artifacts/efr32-brd2703a-light-skip-rps-generation
          ls out/artifacts/efr32-brd2703a-light-skip-rps-generation/flashbundle/
          cp out/artifacts/efr32-brd2703a-light-skip-rps-generation/flashbundle/matter-silabs-lighting-example.s37 \
            ./raw-silabs-lighting.s37

      - name: Set up commander and snb-command
        run: |
          DEBIAN_FRONTEND=noninteractive apt install -y unzip libkrb5-3 libgssapi-krb5-2 libglib2.0-0 libgl1 wget bzip2 && \
          wget https://www.silabs.com/documents/public/software/SimplicityCommander-Linux.zip && \
          unzip SimplicityCommander-Linux.zip && \
          tar -xjf SimplicityCommander-Linux/Commander_linux_x86_64_*.tar.bz  && \
          ln -s $(pwd)/commander/commander /usr/local/bin/commander && \
          commander --help
          wget https://github.com/yue-leaf/cli-test/releases/download/v0.0.4/snb && chmod +x snb && \
          ln -s $(pwd)/snb /usr/local/bin/snb && \
          snb config --serviceAddress $serviceAddress --accessKey $snbAccessKey --secretKey $snbSecretKey

      - name: Signature application firmware
        run: |
          commander convert raw-silabs-lighting.s37 --secureboot --extsign --outfile silabs-lighting && \
          snb kms sign --keyId $snbSignDataKey --inputFile ./silabs-lighting.extsign --outputFile ./silabs-lighting-signature.der && \
          snb kms exportPubKey --keyId $snbSignDataKey --outputFile ./public_key.pem && \
          commander convert raw-silabs-lighting.s37 --secureboot --signature silabs-lighting-signature.der --verify public_key.pem --outfile signed-silabs-lighting.s37 && \
          commander util appinfo signed-silabs-lighting.s37
          snb obis push --file signed-silabs-lighting.s37 --fileType $appFirmwareType --resourcePackageId $appFirmwareResourcePackageId --env TEST

      - name: Publish light-application-firmware
        id: upload_light-application-firmware
        uses: actions/upload-artifact@v4
        with:
          name: light-application-firmware
          path: |
            signed-silabs-lighting.s37
            raw-silabs-lighting.s37

      - name: Signature bootloader
        run: |
          wget https://github.com/SiliconLabs/matter_extension/releases/download/v2.5.0/bootloader_binaries_matter_extension_v2.5.0-1.4.zip && \
          unzip bootloader_binaries_matter_extension_v2.5.0-1.4.zip && \
          cd bootloader_binaries && \
          commander convert bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37 --secureboot --extsign --outfile bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1 && \
          snb kms sign -keyId $snbSignDataKey --inputFile ./bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.extsign --outputFile ./bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.der && \
          snb kms exportPubKey --keyId $snbSignDataKey --outputFile ./public_key.pem && \
          commander convert bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37 --secureboot --signature bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.der --verify public_key.pem --outfile signatured_bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37 && \
          commander util appinfo signatured_bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37 && \
          snb obis push --file signatured_bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37 --fileType $bootloaderFirmwareType --resourcePackageId $bootloaderResourcePackageId --env TEST

      - name: Publish bootloader
        id: upload_bootloader
        uses: actions/upload-artifact@v4
        with:
          name: bootloader
          path: |
            bootloader_binaries/signatured_bootloader-storage-internal-single-512k-BRD2703A-gsdk4.1.s37

      - name: Echo artifact download URL
        run: |
          APPLICATION_DOWNLOAD_URL="${{ steps.upload_light-application-firmware.outputs.artifact-url }}"
          echo "Artifact application download URL: $APPLICATION_DOWNLOAD_URL"
          
          BOOTLOADER_DOWNLOAD_URL="${{ steps.upload_bootloader.outputs.artifact-url }}"
          echo "Artifact bootloader download URL: $BOOTLOADER_DOWNLOAD_URL"          
          
          
