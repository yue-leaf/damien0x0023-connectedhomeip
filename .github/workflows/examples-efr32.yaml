name: Build example - EFR32

on:
  push:
    branches:
      - huwei-ci

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}-${{ (github.event_name == 'pull_request' && github.event.number) || (github.event_name == 'workflow_dispatch' && github.run_number) || github.sha }}
  cancel-in-progress: true

env:
  CHIP_NO_LOG_TIMESTAMPS: true

jobs:
  efr32:
    name: EFR32

    env:
      SILABS_BOARD: BRD2703A
      BUILD_TYPE: gn_efr32

    runs-on: ubuntu-latest
    if: github.actor != 'restyled-io[bot]'

    container:
      image: ghcr.io/project-chip/chip-build-efr32:94
      volumes:
        - "/tmp/bloat_reports:/tmp/bloat_reports"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Checkout submodules & Bootstrap
        uses: ./.github/actions/checkout-submodules-and-bootstrap
        with:
          platform: silabs_docker

      - name: Set up environment for size reports
        uses: ./.github/actions/setup-size-reports
        if: ${{ !env.ACT }}
        with:
          gh-context: ${{ toJson(github) }}

#      - name: Test SLC gen
#        timeout-minutes: 30
#        run: |
#          scripts/examples/gn_silabs_example.sh examples/lighting-app/silabs ./out/light-app BRD2703A  --slc_generate --docker
#          echo "=========================1======================"
#          ls out/light-app/
#          echo "=========================2======================"
#
#      - name: Publish artifacts 1
#        uses: actions/upload-artifact@v4
#        with:
#          name: light-app,${{ github.event_name }}
#          path: |
#            out/light-app/*
#
#      - name: clean out build output
#        run: rm -rf ./out

      - name: Build light
        run: |
          ./scripts/run_in_build_env.sh \
             "./scripts/build/build_examples.py \
                --enable-flashbundle \
                --target efr32-brd2703a-light-skip-rps-generation \
                build \
                --copy-artifacts-to out/artifacts \
             "
          echo "=========================3======================"
          pwd
          echo "=========================4======================"
          ls out/artifacts/
          commander
          echo "=========================5======================"
      

      - name: Publish artifacts 2
        uses: actions/upload-artifact@v4
        with:
          name: light-examples,${{ github.event_name }}
          path: |
            out/artifacts/*
  
