/*-------------------------------------------------------------------
** Execute upon software RESET
** Clear AON reg 0x40001d00 bit1(km4_pon_boot_done) to do whole reset
  Note: must select device cm55 firstly!
**-----------------------------------------------------------------*/
FUNC void OnResetExec(void) {
  unsigned long aon;
  unsigned long aonRegAddr;
  
  aonRegAddr = 0x40001D00;
  aon = _RDWORD(aonRegAddr);
  printf("Aon Register default value: 0x%04X\n", aon);

  /*clear bit1*/
  aon &= 0xFFFFFFFD;
  _WDWORD(aonRegAddr, aon);
  
  aon = _RDWORD(aonRegAddr);
  printf("Aon Register Modified value: 0x%04X\n", aon);

  printf("OnResetExec End...\n");
}

FUNC void Setup (void) {
  OnResetExec();
} 

/*-------------------------------------------------------------------
** Invoke the function at debugger startup
**-----------------------------------------------------------------*/
Setup(); 